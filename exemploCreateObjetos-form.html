<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Objetos</title>

    <script type="text/javascript">
        function cadastrarCurso() {
            // criando um objeto com duas propriedades
            var curso = {
                sigla: document.getElementById("sigla").value,
                nome: document.getElementById("nome").value
            };

            if ( (curso.sigla === "") || (curso.nome === "") ) {
                document.getElementById("erro").textContent = "Campos obrigatórios!";
                document.getElementById("erro").style.color = "red";
                return; //para a execução do código aqui
            }

            //acessa a tabela
            let tabela = document.getElementById("tabelaCursos");

            //cria uma linha (<tr></tr>) na tabela
            let novaLinha = tabela.insertRow();

            //add celula na linha criada com a sigla (<td></td>)
            novaLinha.insertCell(0).textContent = (curso.sigla).toUpperCase();

            //add celula na linha criada com a nome (<td></td>)
            novaLinha.insertCell(1).textContent = curso.nome;

            tabela.appendChild(novaLinha); //adiciona a linha com as celular na tabela

            // limpa os campos de form
            document.getElementById("sigla").value = "";
            document.getElementById("nome").value = "";

            document.querySelector("#erro").textContent = "";
        }

    </script>

</head>
<body>
    <h2>Cadastro de cursos:</h2>
    <form>
        Sigla:<br>
        <input type="text" id="sigla">

        <br><br>
        Nome do Curso:<br>
        <input type="text" id="nome">

        <br><br>
        <input type="button" value="Cadastrar" onclick="cadastrarCurso();">

        <br><br>
        <span id="erro"></span>

    </form>

    <hr>
    <h2>Cursos Cadastrados</h2>
    <table border="1" id="tabelaCursos" width="30%">
        <tr>
            <th>Sigla</th>
            <th>Nome</th>
        </tr>
    </table>
</body>
</html>
