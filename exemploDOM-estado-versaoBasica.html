<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script type="text/javascript">

        function gerarCidades() {
            var cidadesSP = ["São Paulo", "Campinas", "Valinhos"];
            var cidadesMG = ["Belo Horizonte", "Varginha", "Mantimentos"];
            var cidadesRJ = ["Rio de Janeiro", "Niterói", "Angra dos Reis"];

            var estado = document.getElementById("estado").value;

            if (estado == "") {
                limpaCombo();
            }

            if (estado == "SP") {
                limpaCombo();
                alimentaCombo(cidadesSP);
            }

            if (estado == "MG") {
                limpaCombo();
                alimentaCombo(cidadesMG);
            }

            if (estado == "RJ") {
                limpaCombo();
                alimentaCombo(cidadesRJ);
            }
        }

        function limpaCombo() {
            const comboCidade = document.getElementById("cidade");
            comboCidade.innerHTML = "";
        }

        function alimentaCombo(cidades) {
            let cidade = document.getElementById("cidade");

            for (let i = 0; i < cidades.length; i++) {
                option = document.createElement("option");
                option.text = cidades[i];
                option.value = cidades[i];
                cidade.add(option);
            }
        }

    </script>

</head>

<body>
    
    <form>
        <label for="estado">Estado:</label><br>

        <select id="estado" onchange="gerarCidades();">
            <option value="">Selecione</option>
            <option value="SP">SP</option>
            <option value="MG">MG</option>
            <option value="RJ">RJ</option>
        </select>

        <br><br>

        <label for="cidade">Cidade:</label><br>
        <select id="cidade">
        </select>
    </form>

</body>
</html>
