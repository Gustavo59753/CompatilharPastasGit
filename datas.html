<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datas</title>
    <script>
        const dizerMsg = (msg, cor) => {
            document.querySelector('#msg').textContent = msg;
            document.querySelector('#msg').style.color = cor;
        }

        const pesquisar = () => {
            let dataInicial = document.querySelector('#dataInicial').value;
            let dataFinal = document.querySelector('#dataFinal').value;

            if (dataInicial === '' || dataFinal === '') {
                //alert('Infore um período para ser pesquisado!');
                dizerMsg("Informe um período para ser pesquisado!", "red");
                return;
            }

            if (dataInicial > dataFinal) {
                //alert('A data inicial deve ser anterior à data final.');
                dizerMsg("A data inicial deve ser anterior à data final.", "red");
                return;
            }

            dizerMsg("Processando ...", "green");
        }
    </script>
</head>
<body>
<h1>Relatório de Vendas por Período</h1>
<hr>

    <form>
        <label for="dataInicial">Data inicial:</label><br>
        <input type="date" id="dataInicial" name="dataInicial"><br><br>

        <label for="dataFinal">Data final:</label><br>
        <input type="date" id="dataFinal" name="dataFinal"><br><br>

        <input type="button" value="Buscar" onclick="pesquisar()"><br><br>
        <span id="msg"></span>
    </form>

    <hr>

    <h1>Trabalhando com datas</h1>

    <hr>

    <div id="resultado"></div>

    <script>
        let saida = "";

        let hoje = new Date();
        saida += "<p><b>Data Aual:</b> " + hoje + "</p>";

        let data = new Date(2024, 0, 1); 
        saida += "<p><b>Data Específica:</b> " + data + "</p>";

        saida += "<p><b>Dia:</b> " + hoje.getDate() + "</p>";
        saida += "<p><b>Mês:</b> " + (hoje.getMonth() + 1) + "</p>";
        saida += "<p><b>Ano:</b> " + hoje.getFullYear() + "</p>";
        saida += "<p><b>Dia da Semana:</b> " + hoje.getDay() + "</p>";
        saida += "<p><b>Hora:</b> " + hoje.getHours() + "</p>";
        saida += "<p><b>Minutos:</b> " + hoje.getMinutes() + "</p>";
        saida += "<p><b>Segundos:</b> " + hoje.getSeconds() + "</p>";

        saida += "<p><b>Data Formatada:</b> " + hoje.getDate() + "/" + (hoje.getMonth() + 1) + "/" + hoje.getFullYear() + "</p>";

        //TimeStamp
        let inicio = new Date("2026-05-01");
        let fim = new Date("2026-05-04");

        // em milisegundos
        saida += "<p><b>TimeStamp inicial:</b> " + inicio.getTime() + "</p>";
        saida += "<p><b>TimeStamp final:</b> " + fim.getTime() + "</p>";

        let diferenca = fim.getTime() - inicio.getTime();
        saida += "<p><b>Timestamp diferença:</b> " + diferenca + "</p>";

        let diasDifenca = diferenca / (1000 * 60 * 60 * 24);
        saida += "<p><b>Diferença em dias:</b> " + diasDifenca + "</p>";

        let meses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ]

        let diasSemana = [
            "Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira",
            "Quinta-feira", "Sexta-feira", "Sábado"
        ]

        saida += "<p><b>Data por extenso:</b> " + diasSemana[hoje.getDay()] + ", " + hoje.getDate() + " de " + meses[hoje.getMonth()] + " de " + hoje.getFullYear() + "</p>";

        document.querySelector('#resultado').innerHTML = saida;

    </script>
</body>
</html>
