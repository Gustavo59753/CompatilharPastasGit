<!DOCTYPE html>
<html lang="ptbr">
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Média</title>

    <script>
        function calcularMedia() {
            let n1 = parseFloat(document.getElementById("nota1").value);
            let n2 = parseFloat(document.getElementById("nota2").value);
        
            if (!n1 || !n2) {
                Swal.fire({
                    icon: "warning",
                    title: "Preencher todos os campos"
                });
                return;
            }
            let media = (n1*4 + n2*6) / 10;

            let situacao = (media < 6) ? "Reprovado" : "Aprovado";
            
            let icone = (media < 6) ? "error" : "success";

            Swal.fire({
                title: `Média: ${media} - Situação: ${situacao}`,
                icon: icone,
                draggable: true
            });
            
            const somar = () => {
                return arguments[0] + arguments[1] + arguments[2];
            }

            let resultado = somar(10,5,1);

            console.log(resultado);
            alert(resultado);
            

            //alert(`Média: ${media} - Situação: ${situacao}`)
        }
    </script>
</head>
<body>
    <h1>Cálculo de Média</h1>
    <hr>
    <form>
        Nota 1:<br>
        <input type="text" id="nota1">

        <br><br>

        Nota 2:<br>
        <input type="text" id="nota2">

        <input type="button" value="Calcular" onclick="calcularMedia();">
    </form>
</body>
</html>
