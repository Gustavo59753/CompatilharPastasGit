<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
</head>
<body>
    <h2>Cadastro de Cliente</h2>

    <form id="formCadastro" onsubmit="return validarFormulario()">

        <input type="radio" name="tipo" value="fisica" id="pf" checked onclick="trocaCampos('PF');">Pessoa Física<br>
        
        <input type="radio" name="tipo" value="juridica" id="pj" onclick="trocaCampos('PJ');"> Pessoa Jurídica<br><br>

        <!-- Campos para Pessoa Física -->
        <div id="camposPF">
            <label for="nome">👨🏽Nome:</label><br>
            <input type="text" id="nome" size="40"><br><br>

            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf"><br><br>
        </div>

        <!-- Campos para Pessoa Jurídica -->
        <div id="camposPJ" style="display: none;">
            <label for="razaoSocial">👨🏽‍💼Razão Social:</label><br>
            <input type="text" id="razao" size="40"><br><br>

            <label for="cnpj">CNPJ:</label><br>
            <input type="text" id="cnpj"><br><br>
        </div>

        <!-- Campos comuns -->
        <label for="telefone">Telefone:</label><br>
        <input type="text" id="telefone"><br><br>

        <label for="email">E-mail:</label><br>
        <input type="text" id="email" size="30"><br><br>

        <label for="endereco">Endereço:</label><br>
        <input type="text" id="endereco" size="60"><br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <p id="mensagem"></p>

    <script>
        const camposPF = document.getElementById("camposPF");
        const camposPJ = document.getElementById("camposPJ");

        function trocaCampos(tipo) {
            if (tipo == "PF") {
                camposPF.style.display = "block";
                camposPJ.style.display = "none";
            }

            if (tipo == "PJ") {
                camposPF.style.display = "none";
                camposPJ.style.display = "block";
            }
        }

        function validarFormulario() {
            const msg = document.getElementById("mensagem");

            const tipo = document.querySelector('input[name="tipo"]:checked').value

            if (tipo === "fisica") {
                const nome = document.getElementById("nome").value.trim();
                const cpf = document.getElementById("cpf").value.trim();

                if (!nome || !cpf) {
                    msg.textContent = "Informe o nome e o CPF!";
                    msg.style.color = "red";
                    document.getElementById("nome").style.borderColor = "red"
                    document.getElementById("cpf").style.borderColor = "red"
                    return false;
                }
            } else {
                const razao = document.getElementById("razao").value.trim();
                const cnpj = document.getElementById("cnpj").value.trim();
            
                if (!razao || !cnpj) {
                    msg.textContent = "Informe a Razão Social e o CNPJ!";
                    msg.style.color = "red";
                    document.getElementById("razao").style.borderColor = "red"
                    document.getElementById("cnpj").style.borderColor = "red"
                    return false;
                }
            }
        }

    </script>
</body>
</html>
